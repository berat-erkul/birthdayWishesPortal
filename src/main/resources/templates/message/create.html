<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 50px;
      margin: 0;
    }

    .message-container {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }

    .message-container h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #555;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #007bff;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      text-align: center;
      margin-top: 20px;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .cancel-link {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      color: #777;
      font-size: 0.9rem;
    }

    .cancel-link:hover {
      text-decoration: underline;
      color: #333;
    }
  </style>
</head>
<body>

<div class="message-container">
  <h1>Create New Message</h1>

  <!-- Form -->
  <form th:action="@{/message/create/{studentID}/send(studentID=${studentID})}"
        th:object="${message}" method="post">

    <!-- Receiver -->
    <div class="form-group">
      <label for="receiver">Receiver</label>
      <!-- Kullanıcı listesi dropdown -->
      <select id="receiver" th:field="*{receiver.id}">
        <option value="" disabled selected>Select a receiver</option>
        <option th:each="user : ${teachers}"
                th:value="${user.id}"
                th:text="${user.firstName} + ' ' + ${user.lastName}">
        </option>
      </select>
    </div>

    <!-- Content -->
    <div class="form-group">
      <label for="content">Message</label>
      <textarea id="content" th:field="*{content}" placeholder="Write your message..."></textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="submit">Send Message</button>
    </div>

    <div class="form-actions">
      <a th:href="@{/message/list/{studentID}(studentID=${studentID})}" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>

</body>
</html>
