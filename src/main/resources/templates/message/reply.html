<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesaj Yanıtlama Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        .meta-info {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 15px;
        }

        .message-box {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
        }

        button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">Mesaj Yanıtlama Paneli</div>

    <div class="meta-info">
        <div><strong>Gönderen:</strong> <span th:text="${message.senderName}">Öğrenci Adı</span></div>
        <div><strong>Tarih:</strong> <span th:text="${message.date}">Gönderilen Tarih</span></div>
    </div>

    <!-- Asıl Mesaj -->
    <div class="message-box" th:text="${message.content}">
        Öğrenciden gelen mesaj içeriği. Kısacası <strong>Message</strong> nesnesinin content (içerik) kısmı burada gösterilir.
    </div>

    <!-- Yanıtlanan Mesaj (Alıntı) -->
    <div class="meta-info" th:if="${replyToContent != null}">
        <strong>Yanıtladığınız Mesaj:</strong>
        <div class="message-box" th:text="${replyToContent}">
            Alıntılanan mesaj içeriği burada gösterilecek.
        </div>
    </div>

    <!-- Yanıtlama Formu -->
    <form method="post" th:action="@{/message/reply/save}">
        <label for="reply">Yanıtınızı aşağıya yazınız:</label>
        <textarea id="reply" name="reply" placeholder="Yanıtınızı buraya yazınız..."></textarea>

        <input type="hidden" name="originalMessageId" th:value="${message.id}" />
        <button type="submit">Yanıtı Kaydet</button>
    </form>
</div>
</body>
</html>
