<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kullanıcı Listesi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            color: #374151;
        }

        tr:hover {
            background-color: #f3f4f6;
        }

        .btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-update {
            background-color: #10b981; /* yeşil */
        }

        .btn-delete {
            background-color: #ef4444; /* kırmızı */
        }

        .btn:hover {
            opacity: 0.9;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kayıtlı Kullanıcılar</h2>

    <table>
        <thead>
        <tr>
            <th>Ad</th>
            <th>Soyad</th>
            <th>Email</th>
            <th>Doğum Günü</th>
            <th>Rol</th>
            <th>İşlemler</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="userDTO : ${users}">

            <td th:text="${userDTO.firstName}">Ad</td>
            <td th:text="${userDTO.lastName}">Soyad</td>
            <td th:text="${userDTO.email}">Email</td>
            <td th:text="${#temporals.format(userDTO.birthday, 'dd.MM.yyyy')}">Doğum Günü</td>
            <td th:text="${userDTO.role}">Rol</td>
            <td>
                <div class="actions">
                    <a th:href="@{/userDTO/update/{id}(id=${userDTO.id})}" class="btn btn-update">Güncelle</a>
                    <a th:href="@{/userDTO/delete/{id}(id=${userDTO.id})}" class="btn btn-delete">Sil</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
