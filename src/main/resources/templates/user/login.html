<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #4a90e2, #50c9c3, #6372ff, #ff6ec4);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: "Segoe UI", sans-serif;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            width: 380px;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-30px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .login-container h3 {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .login-container p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        .btn-custom {
            background: linear-gradient(45deg, #4a90e2, #50c9c3);
            color: #fff;
            font-weight: bold;
            width: 100%;
            border-radius: 12px;
            padding: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .forgot {
            font-size: 14px;
            text-decoration: none;
            color: #4a90e2;
            margin-left: 10px;
            transition: color 0.3s;
        }

        .forgot:hover {
            color: #285e8e;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h3>Hoş Geldin 👋</h3>
    <p>Devam etmek için bilgilerini gir</p>
    <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
        <div class="mb-3 text-start">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="ornek@domain.com" required>
            <div class="invalid-feedback">Lütfen email giriniz.</div>
        </div>
        <div class="mb-3 text-start">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="********" required>
            <div class="invalid-feedback">Lütfen şifre giriniz.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                <label for="remember" class="form-check-label">Beni hatırla</label>
            </div>
            <a href="#" class="forgot">Şifreni mi unuttun?</a>
        </div>
        <button type="submit" class="btn btn-custom">Giriş Yap</button>
    </form>
</div>

</body>
</html>
